---
name: Build Dataverse images
description: >-
  Pull the published base image when it exists, otherwise build it, then package
  the Dataverse and configbaker images for the runner architecture.

runs:
  using: composite
  steps:
    - name: Verify Docker
      shell: bash
      run: docker version

    - name: Fetch or build local base image
      shell: bash
      run: |
        set -euo pipefail
        BASE_IMAGE=$(cd modules/container-base && mvn -B build-helper:parse-version help:evaluate -Dexpression=base.image -q -DforceStdout -Pct)
        echo "Target base image: $BASE_IMAGE"
        if docker pull "$BASE_IMAGE"; then
          echo "Base image pulled."
        else
          echo "Pull failed. Building the base image locally."
          mvn -B -Pct clean package -f modules/container-base/pom.xml
        fi

    - name: Build Dataverse containers via Maven
      shell: bash
      run: |
        set -euo pipefail
        mvn -B -Pct -T 1C package
        docker image inspect gdcc/dataverse:unstable gdcc/configbaker:unstable >/dev/null
        test -d target/dataverse
